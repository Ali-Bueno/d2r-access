# Navigation radar. Restart the game after changing these defaults.
# Ctrl+R also toggles the radar for the current run.
[radar]
enabled = true
# Cue loudness, 0-100 percent of the compiled level.
volume = 100
# false = the four rays follow the left stick's up, left, right and down.
# true = its diagonals, which the game turns into the directions its walls and
# corridors run in (every ray then sounds from one side, up and down told apart
# by pitch alone). The console commands access-radar diagonal|cardinal switch
# for the current run.
diagonals = false

# Long-range guidance starts with exploration-first routes through visited
# areas. Set true to allow the optional full-assistance route through areas
# the character has not visited. Restart the game after changing this value.
[navigation]
full_assistance = false

# Nearest unvisited dungeon room loop and a single cue on first entry.
# Area-transition loops use the existing Ctrl+P exit-sound toggle.
[exploration]
enabled = true

# Speech when the scanner lists an exit, waypoint or stash for the first time on
# a map ("The radar has logged a new exit"). The exit back to the level you came
# from is never announced.
[discoveries]
enabled = true

# Speech after a weapon swap (R3, W): the set and the weapons now in hand.
# access-weapon-swap on|off toggles it for the current run.
[weapon_swap]
enabled = true

# Player-to-player trade: who asks, what the other player offers, accepts or
# withdraws, and whether the trade completed. access-trade on|off toggles it.
[trade]
enabled = true

# Friendly NPC announcer: names the nearest town NPC (never enemies, objects or
# items) once it comes within range, with its distance and screen direction, so
# the left stick can walk to it. Ctrl+N toggles it for the current run.
[npc]
enabled = true
# Reach in the entity scan's unit (collision subtiles, about one metre each).
range = 15
# true = only NPCs with a clear terrain line of sight; false = walls do not hide them.
line_of_sight = true

# Synthesized proximity pulses, using the radar's fixed screen directions.
# Separate from NPC speech. Faster nearby; nearest NPC and up to two priority
# enemy classes only. Restart after editing; access-entity-cues toggles live.
[entity_cues]
enabled = true
npcs = true
enemies = true
# Ordinary ranged enemies join bosses/elites and resurrectors when enabled.
ranged = true
range = 15
# 0-100 percent of the soft synthesized level, independent of radar volume.
volume = 100

# One-shot: write the game's whole mapped image next to the plugin at startup,
# for offline analysis (about 60-70 MB, written once and skipped if it is
# already there). Armed here rather than from the console because the console
# cannot be opened outside a loaded game, and the image is wanted from the very
# first screen onwards.
[dump]
enabled = false

# Focused-widget byte dump, for deriving offsets the SDK does not expose.
# Armed here because the developer console cannot be opened outside a loaded
# game, and the screens worth probing are the ones where it cannot.
[probe]
enabled = false

# What the game puts on the monster health plate and the world target label. Its
# own targeting reaches through walls, so the name of a monster, object or NPC in
# the next room would otherwise be read out while the entity scan, which needs a
# line of sight, does not list it at all.
[target]
# true = speak a HUD label only when the entity it names is in sight;
# false = speak every label, as before this gate existed.
line_of_sight = true
# How far a bearer of that name may stand and still be the one the label means,
# in collision subtiles. The game labels only what is on screen, and a legacy
# 800x600 screen spans about forty of them.
reach = 40

# Containers you open for loot — chests, caskets, urns, barrels, corpses — get a
# looping cue like the items on the floor: louder as you approach, placed in
# stereo. Opening one silences it. Ctrl+K toggles this for the current run.
[chests]
enabled = true

# Direct movement stops when its intended direction is blocked, instead of
# choosing another direction along the wall. Mouse routes retain stock behavior.
# access-movement on|off changes this for the current session.
[movement]
enabled = true

# Read hosting readiness and browser status changes in D2RLoader multiplayer.
[multiplayer]
enabled = true

# Move between D2RLoader form controls once per D-pad press.
[menu_navigation]
enabled = true

# Navigation radar. Restart the game after changing these defaults.
# Ctrl+R also toggles the radar for the current run.
[radar]
enabled = true
# Cue loudness, 0-100 percent of the compiled level.
volume = 100

# Friendly NPC announcer: names the nearest town NPC (never enemies, objects or
# items) once it comes within range, with its distance and screen direction, so
# the left stick can walk to it. Ctrl+N toggles it for the current run.
[npc]
enabled = true
# Reach in the entity scan's unit (collision subtiles, about one metre each).
range = 15
# true = only NPCs with a clear terrain line of sight; false = walls do not hide them.
line_of_sight = false

# Keyboard as a controller. D2R has controller code for everything keyboard
# play is missing -- menu focus, movement pathing, and firing a skill at the
# target the game picks -- so the keyboard drives a synthetic pad rather than
# reimplementing any of it. The pad answers on the lowest slot no real
# controller occupies, so a physical pad keeps working untouched.
# Ctrl+Shift+F12 turns it on and off at any time, and that is the better way in:
# entering controller mode disables the game's own input actions, which is what
# the developer console's Ctrl+` hotkey and every mod hotkey are registered as.
# Leave this false to keep those working, and press the toggle when you want to
# play from the keyboard.
# WASD moves, O/K/L/; scan, J/N/U/I are A/B/X/Y, Y/B the shoulders, T/V the
# triggers, ' is L3 and / is R3, = and - are Start and Back, and the arrow keys
# are the D-pad.
[keyboard]
enabled = false

# One-shot: write the game's whole mapped image next to the plugin at startup,
# for offline analysis (about 60-70 MB, written once and skipped if it is
# already there). Armed here rather than from the console because turning the
# keyboard pad on puts the game in controller mode, which disables the keyboard
# -- and Ctrl+` is a keyboard combination, so the console cannot be opened at
# all while that is running.
[dump]
enabled = false

# Focused-widget byte dump, for deriving offsets the SDK does not expose.
# Armed here because the developer console cannot be opened outside a loaded
# game, and the screens worth probing are the ones where it cannot.
[probe]
enabled = false
